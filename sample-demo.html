<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Click Rush</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#263f29,#111e18);color:#ecf5e7;font:14px system-ui;text-align:center;height:100dvh;overflow:hidden}header{position:absolute;top:14px;left:20px;right:20px;pointer-events:none;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:15px}h1{margin:0;font-size:clamp(16px,3vw,29px);letter-spacing:-1px}header p{color:#94b08d;margin:5px 0 0;font-size:11px}#score{font-size:clamp(12px,2vw,20px);color:#d5ff5f}#welcome{position:absolute;inset:35% 10% auto}#welcome p{color:#a2bb99;font-size:12px}#target{position:absolute;width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#d5ff5f;color:#182012;font-size:23px;box-shadow:0 0 35px #d5ff5f55;touch-action:manipulation;cursor:pointer}#start{padding:12px 23px;border:0;border-radius:8px;background:#d5ff5f;color:#14221b;font:bold 13px system-ui;cursor:pointer}#target[hidden]{display:none}#target:focus-visible,#start:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style></head><body><header><div><h1>Click Rush<span style="color:#d5ff5f">.</span></h1><p>Catch the glow. Beat the clock.</p></div><div id="score" role="status">20 seconds. How many hits?</div></header><div id="welcome"><p>Click or tap the glowing target. Keep the streak going.</p><button id="start">Start round →</button></div><button id="target" hidden aria-label="Hit target">✦</button>
<script>
let score=0,left=20,timer;const target=document.getElementById('target'),display=document.getElementById('score'),start=document.getElementById('start'),welcome=document.getElementById('welcome');
function move(){target.style.left=(12+Math.random()*Math.max(0,innerWidth-72))+'px';const top=Math.min(76,Math.max(12,innerHeight-70));target.style.top=(top+Math.random()*Math.max(0,innerHeight-top-70))+'px'}
start.onclick=()=>{clearInterval(timer);score=0;left=20;welcome.hidden=true;target.hidden=false;move();display.textContent='0 hits · 20s';timer=setInterval(()=>{left--;display.textContent=score+' hits · '+left+'s';if(left<=0){clearInterval(timer);target.hidden=true;welcome.hidden=false;start.textContent='Play again →';display.textContent=score+' hits. Good round!'}},1000)};
target.onclick=()=>{score++;display.textContent=score+' hits · '+left+'s';move()};window.addEventListener('resize',()=>{if(!target.hidden)move()});
</script></body></html>
