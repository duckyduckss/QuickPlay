<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Click Rush</title><style>body{margin:0;background:#14221b;color:#ecf5e7;font:18px system-ui;text-align:center;height:100dvh;overflow:hidden}h1{margin:80px 0 8px;font-size:40px}p{color:#b1c8b6}#target{position:absolute;width:65px;height:65px;border-radius:50%;border:3px solid #fff;background:#d5ff5f;color:#182012;font-size:26px;box-shadow:0 0 35px #d5ff5f55;touch-action:manipulation}#start{padding:15px 25px;border:0;border-radius:12px;background:#d5ff5f;color:#14221b;font:bold 18px system-ui}#score{font-size:27px;color:#d5ff5f}#target[hidden]{display:none}</style></head><body><h1>Click Rush</h1><p>Catch the glow. Beat the clock.</p><div id="score">20 seconds. How many hits?</div><p><button id="start">Start round</button></p><button id="target" hidden aria-label="Hit target">✦</button><script>let score=0,left=20,timer;const target=document.getElementById('target'),display=document.getElementById('score'),start=document.getElementById('start');function move(){target.style.left=(15+Math.random()*Math.max(20,innerWidth-95))+'px';target.style.top=(250+Math.random()*Math.max(20,innerHeight-360))+'px'}start.onclick=()=>{clearInterval(timer);score=0;left=20;start.hidden=true;target.hidden=false;move();display.textContent='0 hits · 20s';timer=setInterval(()=>{left--;display.textContent=score+' hits · '+left+'s';if(left<=0){clearInterval(timer);target.hidden=true;start.hidden=false;start.textContent='Play again';display.textContent=score+' hits. Good round!'}},1000)};target.onclick=()=>{score++;display.textContent=score+' hits · '+left+'s';move()};</script></body></html>
